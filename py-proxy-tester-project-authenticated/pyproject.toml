[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-proxy-tester-project-authenticated"
version = "0.0.1"
description = "Proxy behaviour test fixture for the Intuned platform tester (authenticated)"
authors = [{ name = "Intuned", email = "service@intunedhq.com" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
keywords = [
    "Python",
    "intuned-browser-sdk",
]
dependencies = [
    "playwright==1.61.0",
    "intuned-runtime===1.3.44a3",
    "intuned-browser==0.1.18",
]

[tool.uv]
package = false

# The conditional-proxy runtime is only on TestPyPI for now. `explicit = true`
# keeps this index scoped to the one package bound to it below, so playwright
# and intuned-browser still resolve from PyPI.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
intuned-runtime = { index = "testpypi" }
